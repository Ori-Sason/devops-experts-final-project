apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webDeployment.name }}
  labels:
    app: {{ .Values.webDeployment.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.webDeployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webDeployment.name }}
    spec:
      containers:
        - name: {{ .Values.webDeployment.name }}
          image: orisason1/devops-experts-final-project:v4
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: {{ .Values.webDeployment.name }}-configmap   # DONE
            - secretRef:
                name: {{ .Values.webDeployment.name }}-db-secret   # DONE
          ports:
            - containerPort: 5000
              name: {{ .Values.webService.portName }}   # DONE
          resources:
            # Low to show HPA fast
            limits:
              cpu: 100m
            requests:
              cpu: 50m
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.webService.portName }}   # DONE
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.webService.portName }}    # DONE
            initialDelaySeconds: 20
      initContainers:
      - name: wait-for-db
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          echo "Waiting for database service..."
          # DONE-svc name + port
          until nc -z {{ .Values.dbService.name }} {{ .Values.dbService.port }}; do
            echo "DB not ready, sleeping 2s..."
            sleep 2
          done
          echo "DB is up!"
