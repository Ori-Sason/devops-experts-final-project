apiVersion: v1
kind: Service
metadata:
  name: {{ include "visit-counter.componentName" (list . "web-db-svc") }}   # DONE2
  labels:
    app: {{ .Values.dbService.name }}   # DONE
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.webDeployment.name }}-db   # DONE
  ports:
    - protocol: TCP
      port: {{ .Values.dbService.port }}
      targetPort: {{ .Values.dbService.portName }}   # DONE
