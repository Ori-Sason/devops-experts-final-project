apiVersion: v1
kind: Service
metadata:
  name: {{ include "visit-counter.componentName" (list . "web-db-svc") }}
  labels:
    {{- include "visit-counter.labels" . | nindent 4 }}
    {{- include "visit-counter.selectorLabels" (list . "web-db-svc") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "visit-counter.selectorLabels" (list . "web-db") | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.db.service.port }}
      targetPort: {{ .Values.db.service.portName }}
