services:
  db:
    image: postgres:18.3-alpine3.23
    container_name: db
    env_file:
      - './web-app/env/postgres.env'
    volumes:
      - postgres-vol:/var/lib/postgresql/18/docker
    healthcheck:
      # 1. Healthcheck is required because by default, depends_on only waits for the database container to start,
      # not for the database service inside it to be ready to accept connections.
      # 2. Using $$ tells Docker Compose: "Don't try to fill this variable now;
      # wait until the command runs inside the container's shell".
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
  web:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./web-app/Dockerfile
    container_name: web-app
    ports:
      - 80:5000
    env_file:
      - './web-app/env/postgres.env'
      - './web-app/env/web-app.env'

volumes:
  postgres-vol: {}
